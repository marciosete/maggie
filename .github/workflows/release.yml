# Every push to main that carries a feat, fix or perf commit becomes a release:
# Maggie.app built universal, signed and notarized when the Apple secrets are
# set (ad hoc otherwise), published on GitHub Releases as a zip and a DMG, with
# the Sparkle appcast the app updates from.
#
# Versions are semver, decided by the commit messages like semantic-release:
# feat → minor, fix/perf → patch, a breaking change → major. Tags are the only
# record; see fork/next-version.sh.
#
# fork/minimum-version names the oldest version that may keep running; the
# appcast carries it, and an older Maggie holds itself closed until it updates.
# See fork/minimum-build.sh.
#
# Secrets, all optional:
#   MACOS_CERTIFICATE        Developer ID Application certificate, .p12 as base64
#   MACOS_CERTIFICATE_PWD    its password
#   MACOS_CERTIFICATE_NAME   its identity, "Developer ID Application: Name (TEAMID)"
#   APPLE_ID                 the Apple ID to notarize with
#   APPLE_TEAM_ID            its team
#   APPLE_APP_PASSWORD       an app-specific password for it
#   SPARKLE_PRIVATE_KEY      the EdDSA key pairing fork/sparkle-public.key, from
#                            `generate_keys --account Maggie -x`
#
# Without the certificate the app is signed ad hoc and Gatekeeper asks on first
# open; without the Sparkle key no appcast is published and the app can't update
# from the release.

name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # What the commits since the last release call for. No feat, fix or perf
  # since the last tag means no release.
  version:
    runs-on: ubuntu-latest
    outputs:
      bump: ${{ steps.next.outputs.bump }}
      version: ${{ steps.next.outputs.version }}
      build: ${{ steps.next.outputs.build }}
      commit: ${{ steps.next.outputs.commit }}
      minimum_build: ${{ steps.next.outputs.minimum_build }}
    steps:
      - uses: actions/checkout@v5
        with:
          # Tags decide the version, and the commit count is the build number.
          fetch-depth: 0

      - name: Next version
        id: next
        run: |
          next="$(fork/next-version.sh --notes notes.md)"
          version="$(sed -n 's/^version=//p' <<<"$next")"
          build="$(git rev-list --count HEAD)"
          {
            echo "$next"
            echo "build=$build"
            echo "commit=$(git rev-parse --short HEAD)"
            # The oldest build that may keep running, resolved here where the
            # tags are; the release job's checkout has none.
            fork/minimum-build.sh --version "$version" --build "$build"
          } | tee -a "$GITHUB_OUTPUT"
          cat notes.md

      - uses: actions/upload-artifact@v4
        with:
          name: notes
          path: notes.md

  release:
    needs: version
    if: needs.version.outputs.bump != 'none'
    runs-on: macos-26
    # The notary service has taken an hour on a first submission.
    timeout-minutes: 180
    env:
      REPO_URL: https://github.com/${{ github.repository }}
      VERSION: ${{ needs.version.outputs.version }}
      BUILD: ${{ needs.version.outputs.build }}
      COMMIT: ${{ needs.version.outputs.commit }}
      TAG: v${{ needs.version.outputs.version }}
      # The oldest build that may keep running; empty when every build may.
      MINIMUM_BUILD: ${{ needs.version.outputs.minimum_build }}
      # Which optional secrets are set; a step's `if` can't read secrets directly.
      # Each step needs its whole set, so a half-configured one is skipped, not failed.
      HAS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE != '' && secrets.MACOS_CERTIFICATE_PWD != '' && secrets.MACOS_CERTIFICATE_NAME != '' }}
      HAS_NOTARIZATION: ${{ secrets.APPLE_ID != '' && secrets.APPLE_TEAM_ID != '' && secrets.APPLE_APP_PASSWORD != '' }}
      HAS_SPARKLE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@v5

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - uses: actions/download-artifact@v4
        with:
          name: notes

      - name: Toolchain
        run: |
          echo "Maggie $VERSION (build $BUILD, $COMMIT), minimum build: ${MINIMUM_BUILD:-none}"
          xcodebuild -version

      - name: Build GhosttyKit
        run: zig build -Doptimize=ReleaseFast -Demit-macos-app=false

      - name: Build Ghostty.app
        run: |
          cd macos
          xcodebuild -target Ghostty -configuration ReleaseLocal

      - name: Package Maggie.app
        run: |
          fork/package.sh macos/build/ReleaseLocal/Ghostty.app build/Maggie.app \
            --version "$VERSION" --build "$BUILD" --commit "$COMMIT"

      - name: Import signing certificate
        if: env.HAS_CERTIFICATE == 'true'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
        run: |
          echo "$MACOS_CERTIFICATE" | base64 --decode > certificate.p12
          keychain_pwd=$(uuidgen)
          security create-keychain -p "$keychain_pwd" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$keychain_pwd" build.keychain
          security import certificate.p12 -k build.keychain -P "$MACOS_CERTIFICATE_PWD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_pwd" build.keychain
          rm certificate.p12

      - name: Sign
        env:
          MACOS_CERTIFICATE_NAME: ${{ env.HAS_CERTIFICATE == 'true' && secrets.MACOS_CERTIFICATE_NAME || '' }}
        run: |
          app=build/Maggie.app
          identity="${MACOS_CERTIFICATE_NAME:--}"
          # A trusted timestamp needs a real certificate; ad hoc signatures can't have one.
          timestamp=""
          [ "$identity" = "-" ] || timestamp="--timestamp"
          sparkle="$app/Contents/Frameworks/Sparkle.framework/Versions/B"
          # Sparkle's helpers are separate code and are signed one by one, innermost
          # first; the app's own signature then covers the whole bundle.
          for item in \
            "$sparkle/XPCServices/Downloader.xpc" \
            "$sparkle/XPCServices/Installer.xpc" \
            "$sparkle/Autoupdate" \
            "$sparkle/Updater.app" \
            "$app/Contents/Frameworks/Sparkle.framework" \
            "$app/Contents/PlugIns/DockTilePlugin.plugin"
          do
            codesign --force --sign "$identity" --options runtime $timestamp "$item"
          done
          codesign --force --sign "$identity" --options runtime $timestamp \
            --entitlements macos/Ghostty.entitlements "$app"
          codesign --verify --deep --strict "$app"

      - name: Notarize app
        if: env.HAS_NOTARIZATION == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          xcrun notarytool store-credentials notary \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD"
          ditto -c -k --keepParent build/Maggie.app notarize.zip
          xcrun notarytool submit notarize.zip --keychain-profile notary --wait
          xcrun stapler staple build/Maggie.app
          rm notarize.zip

      - name: Archive
        env:
          MACOS_CERTIFICATE_NAME: ${{ env.HAS_CERTIFICATE == 'true' && secrets.MACOS_CERTIFICATE_NAME || '' }}
        run: |
          mkdir -p dist
          ditto -c -k --keepParent build/Maggie.app dist/Maggie-macos-universal.zip
          # The drag-to-Applications window, laid out without Finder (fork/dmg/build.sh).
          fork/dmg/build.sh build/Maggie.app Maggie.dmg
          [ -z "$MACOS_CERTIFICATE_NAME" ] || codesign --force --sign "$MACOS_CERTIFICATE_NAME" --timestamp Maggie.dmg

      - name: Notarize DMG
        if: env.HAS_NOTARIZATION == 'true'
        run: |
          xcrun notarytool submit Maggie.dmg --keychain-profile notary --wait
          xcrun stapler staple Maggie.dmg

      - name: Appcast
        if: env.HAS_SPARKLE_KEY == 'true'
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          SPARKLE_VERSION: 2.9.6
        run: |
          curl -sSL -o sparkle.zip \
            "https://github.com/sparkle-project/Sparkle/releases/download/$SPARKLE_VERSION/Sparkle-for-Swift-Package-Manager.zip"
          mkdir sparkle && unzip -q sparkle.zip -d sparkle
          echo -n "$SPARKLE_PRIVATE_KEY" > sparkle.key
          # Builds below the minimum see this update as critical: Sparkle won't let
          # it be skipped, and Maggie holds itself closed until it is installed.
          critical=""
          [ -z "$MINIMUM_BUILD" ] || critical="--critical-update-version $MINIMUM_BUILD"
          sparkle/bin/generate_appcast \
            --ed-key-file sparkle.key \
            $critical \
            --download-url-prefix "$REPO_URL/releases/download/$TAG/" \
            --link "$REPO_URL/releases" \
            -o appcast.xml dist
          rm sparkle.key
          cat appcast.xml

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Maggie ${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          body_path: notes.md
          files: |
            dist/Maggie-macos-universal.zip
            Maggie.dmg
            appcast.xml

  # The Homebrew cask in marciosete/homebrew-maggie follows each release. It pushes
  # with a deploy key that can write to that one repository and nothing else.
  # Skipped, like signing without its certificate, when the key isn't set.
  homebrew:
    needs: [version, release]
    if: needs.version.outputs.bump != 'none'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      HAS_TAP_KEY: ${{ secrets.HOMEBREW_TAP_KEY != '' }}
    steps:
      - name: Skip without a tap key
        if: env.HAS_TAP_KEY != 'true'
        run: echo "HOMEBREW_TAP_KEY isn't set; the cask isn't updated."

      - uses: actions/checkout@v5
        if: env.HAS_TAP_KEY == 'true'
        with:
          repository: marciosete/homebrew-maggie
          ssh-key: ${{ secrets.HOMEBREW_TAP_KEY }}

      - name: Update the cask
        if: env.HAS_TAP_KEY == 'true'
        run: |
          curl -sSL -o Maggie.dmg \
            "https://github.com/${{ github.repository }}/releases/download/v$VERSION/Maggie.dmg"
          sha="$(sha256sum Maggie.dmg | cut -d' ' -f1)"
          sed -i -E "s/^  version \".*\"/  version \"$VERSION\"/; s/^  sha256 \".*\"/  sha256 \"$sha\"/" Casks/maggie.rb
          git config user.name "maggie-release"
          git config user.email "release@getmaggie.dev"
          git add Casks/maggie.rb
          git commit -m "maggie $VERSION" || echo "cask already at $VERSION"
          git push
