          };
          const pn = document.getElementById('pn');
          const commitN = () => {
            const v = Math.max(1, Math.min(999, Number(pn.value) || 1));
            periodN = v;
            periodAll = false;
            store.set('periodN', v);
            store.set('periodAll', '0');
            paint();
          };
          pn.onchange = commitN;
          pn.onkeydown = (e) => {
            if (e.key === 'Enter') commitN();
          };
          document.getElementById('punit').onchange = (e) => {
            periodUnit = e.target.value;
            periodAll = false;
            store.set('periodUnit', periodUnit);
            store.set('periodAll', '0');
            paint();
          };
          document.getElementById('pgroup').onchange = (e) => {
            group = e.target.value;
            store.set('group', group);
            paint();
          };
          [...document.querySelectorAll('#metric button')].forEach((b) => {
            b.onclick = () => {
              metric = b.dataset.metric;
              store.set('metric', metric);
              paint();
            };
          });
          [...document.querySelectorAll('#c1view button')].forEach((b) => {
            b.setAttribute('aria-pressed', String(b.dataset.view === view));
            b.onclick = () => {
              view = b.dataset.view;
              store.set('view', view);
              paint();
            };
          });
          document.querySelector('.lastwrap').classList.toggle('off', periodAll);
          [...document.querySelectorAll('details.acc')].forEach((d) => {
            d.addEventListener('toggle', () =>
              store.set('acc.' + d.dataset.acc, d.open ? '1' : '0')
            );
          });

          const G = groupLabel(),
            U = UNIT();
          document.getElementById('c1title').textContent =
            view === 'mult'
              ? `Multiplier per ${G}`
              : view === 'cumulative'
                ? `Cumulative ${U}`
                : `Net ${isN() ? 'ncloc' : 'functional LOC'} per ${G}`;
          document.getElementById('c1sub').textContent = TEAM_ONLY
            ? view === 'mult'
              ? `The team multiplier for each ${G} · dashed = the running average, which ends on the headline figure`
              : view === 'cumulative'
                ? `Running total from the first commit · dashed = what ${BASE} ${U} / engineer / day would have reached`
                : `The team's net total per ${G} · a bar below the baseline is a net-deletion ${G} · dashed = the running average per coding ${G}`
            : view === 'mult'
              ? `Each segment is one author's multiplier weighted by their share of the lines, so the bar equals the team multiplier`
              : view === 'cumulative'
                ? `Running total from the first commit, stacked by author · dashed = what ${BASE} ${U} / engineer / day would have reached`
                : `Stacked by author · a bar below the baseline is a net-deletion ${G} · dashed = the running average per coding ${G}`;
          document.getElementById('c1sub').textContent +=
            ` · drawn from ${auDay(chartFrom())}/${chartFrom().slice(2, 4)}`;
          document.getElementById('c1pace').hidden = view !== 'cumulative';
          document.getElementById('c1run').hidden = view === 'cumulative';
          document.getElementById('c1off').hidden = view === 'cumulative' || group !== 'days';
          if (!bs.length) {
            document.getElementById('c1').innerHTML =
              '<div class="empty">No commits in this period.</div>';
            document.getElementById('daytable').innerHTML = '';
            return;
          }
          drawTable(document.getElementById('daytable'), bs);
          const c1 = document.getElementById('c1');
          const fromIso = chartFrom(),
            from = parse(fromIso);
          const drawn = aggregate(days.filter((d) => d.date >= fromIso));
          if (!drawn.length) {
            c1.innerHTML = `<div class="empty">No commits since ${auDay(fromIso)}/${fromIso.slice(0, 4)}.</div>`;
            return;
          }
          const hidden = days.filter((d) => d.date < fromIso);
          const seed = {
            lines: hidden.reduce((s, d) => s + LV(d.team), 0),
            days: hidden.reduce((s, d) => s + d.humans, 0),
          };
          if (view === 'cumulative') drawCumulative(c1, drawn, from);
          else if (view === 'mult') drawMult(c1, drawn, from, seed);
          // Every drawn bucket is also a period bucket, so the rest are the undrawn ones.
          else drawBars(c1, drawn, from, { lines: seed.lines, buckets: bs.length - drawn.length });
        }

        paint();
      })();
    </script>
  </body>
</html>
