          tipMix(b);

        function drawMult(el, bs, from, seed) {
          el.querySelectorAll('svg').forEach((s) => s.remove());
          if (!bs.length) return;
          const H = 260;
          const run = runningMult(bs, seed);
          run.forEach((v, i) => {
            bs[i].runMult = v;
          }); // the tooltip reads it back
          const cs = bs.map(contributions);
          const hi = Math.max(1, ...run, ...bs.map((b) => b.teamMult));
          const { svg, x, bw, y, pw, n, monthRules } = frame(
            el,
            H,
            bs,
            [0, hi * 1.08],
            (v) => v + 'x',
            { from }
          );
          bs.forEach((b, i) => {
            const c = cs[i];
            if (!c.total) return; // a net-deletion period floors at 0
            const tone = (a) => (TEAM_ONLY ? 'var(--team)' : colorOf[a]);
            const shade = (a) =>
              b.partial
                ? {
                    fill: tone(a),
                    'fill-opacity': 0.45,
                    stroke: 'var(--ink-2)',
                    'stroke-width': 1,
                    'stroke-dasharray': '3 2',
                  }
                : b.off
                  ? { fill: tone(a), 'fill-opacity': 0.42, stroke: tone(a), 'stroke-width': 1 }
                  : { fill: tone(a) };
            let acc = 0;
            (TEAM_ONLY ? ['Team'] : authors).forEach((a) => {
              const v = c.parts[a];
              if (!v) return;
              const top = y(acc + v),
                bot = y(acc) - (acc ? 2 : 0);
              if (bot - top > 0.5)
                svg.append(
                  h('rect', {
                    x: x(i) - bw(i) / 2,
                    y: top,
                    width: bw(i),
                    height: Math.max(0.5, bot - top),
                    ...shade(a),
                  })
                );
              acc += v;
            });
          });
          const last = run[run.length - 1];
          drawRun(svg, run, x, y, n, `${fx(last)} running average`);
          svg.append(monthRules);
          tooltip(el, svg, x, n, bs, (b, i) => tipMult(b, cs[bs.indexOf(b)]));
          el.append(svg);
        }

        // Pin every .pin cell at the running width of the pinned cells before it in
        // its row. Measured, because column widths follow the data; re-run when the
        // section opens (a closed <details> has no layout).
        function pinColumns(table) {
          if (!table || !table.offsetWidth) return;
          table.querySelectorAll('tr').forEach((tr) => {
            let left = 0;
            tr.querySelectorAll('.pin').forEach((c) => {
              c.style.left = left + 'px';
              left += c.getBoundingClientRect().width;
            });
          });
        }

        function drawTable(el, bs) {
          // The team's cells, frozen beside the period (pin), with two per-period
          // columns (2026-10-03): Engineers, the distinct people who committed, and
          // lines per engineer per coding day (lines ÷ engineer-days, the baseline's
          // own unit). The table is the team only, with no per-author column groups
          // (2026-10-04).
          const everyone = new Set();
          const teamCells = (o) => {
            // order (2026-10-03): Mult, Commits, Engineers, Commits / engineer,
            // lines, lines / engineer / coding day
            const td = (v, cls) => `<td class="pin${cls ? ' ' + cls : ''}">${v}</td>`;
            if (!o) return ['', '', '', '', '', 'pin-edge'].map((c) => td('·', ('dim ' + c).trim())).join('');
            return (
              td(fx(o.m)) +
              td(fmt(o.c)) +
              td(fmt(o.e)) +
              td(o.e ? (o.c / o.e).toFixed(1) : '·') +
              td(fmt(o.n), o.n < 0 ? 'neg' : '') +
              td(o.d ? fmt(Math.round(o.n / o.d)) : '·', 'pin-edge' + (o.n < 0 ? ' neg' : ''))
            );
          };
          let tn = 0,
            tc = 0,
            eng = 0;
          const rows = [...bs]
            .reverse()
            .map((b) => {
              tn += LV(b.team);
              tc += b.commits;
              eng += b.team.days;
              // who committed in this period: a person with a commit, not merely a merge
              // landing their lines (first-parent history credits the merger)
              const who = authors.filter((a) => b.by[a] && b.by[a].commits > 0);
              who.forEach((a) => everyone.add(a));
              return (
                `<tr><td class="pin">${esc(b.row)}</td>` +
                (b.team.days
                  ? teamCells({ c: b.commits, e: who.length, n: LV(b.team), d: b.team.days, m: b.teamMult })
                  : teamCells(null)) +
                '</tr>'
              );
            })
            .join('');
          // team aggregate: the plain ratio, as the headline and chart
          const teamAgg = eng ? Math.max(0, tn / (BASE * eng)) : 0;
          el.innerHTML = `<table class="pinned compact">
      <thead>
        <tr><th class="pin"></th><th class="grp pin pin-edge" colspan="6">Team</th></tr>
        <tr><th class="pin">${group === 'days' ? 'Date' : 'Period'}</th><th class="pin">Mult</th><th class="pin">Commits</th><th class="pin">Engineers</th><th class="pin">Commits / engineer</th><th class="pin">${UNIT()}</th><th class="pin pin-edge">${UNIT()} / engineer / coding day</th></tr>
      </thead>
      <tbody>${rows}</tbody>
      <tfoot>
        <tr><td class="pin">Aggregate</td>${teamCells({ c: tc, e: everyone.size, n: tn, d: eng, m: teamAgg })}</tr>
        <tr class="days"><td class="pin">days</td><td class="pin pin-edge" colspan="6">${eng} engineer-days · Engineers = distinct people who committed in the period</td></tr>
      </tfoot></table>
      <p class="note" style="margin-top:8px">Multipliers divide by engineer-days inside the period, never by the number of periods.</p>`;
          const tbl = el.querySelector('table.pinned');
          requestAnimationFrame(() => pinColumns(tbl));
          const det = el.closest('details');
          if (det && !det.dataset.pinHook) {
            det.dataset.pinHook = '1';
            det.addEventListener('toggle', () => pinColumns(det.querySelector('table.pinned')));
          }
        }
        window.addEventListener('resize', () =>
          document.querySelectorAll('table.pinned').forEach(pinColumns)
        );

        // The kind of work each author did over the period, and the team. One card
        // each, wrapping, so a team of six reads as well as a team of two.
        function mixSection(s) {
          const who = authors.filter((a) => s.by[a]);
          const cards = who.map((a) => [a, s.by[a].types, colorOf[a]]);
          if (who.length > 1) cards.push(['Team', s.types, null]);
          if (!cards.some(([, m]) => typeTotal(m))) return '';
          const card = ([name, m, c]) => {
            const total = typeTotal(m);
            const center = `<text x="50%" y="47%" text-anchor="middle" class="dc-n">${fmt(total)}</text><text x="50%" y="63%" text-anchor="middle" class="dc-k">commit${total === 1 ? '' : 's'}</text>`;
            return `<div class="mixcard${c ? '' : ' team'}">
              <div class="mixname">${c ? `<i style="background:${c}"></i>` : ''}${esc(name)}</div>
              <div class="mixbody">${donut(m, 104, center)}
                <table class="mixtab"><tbody>${TYPES.map(
                  (t) =>
                    `<tr${m[t.k] ? '' : ' class="dim"'}><td>${swatch(t.c)}${esc(t.label)}</td><td>${fmt(m[t.k] || 0)}</td><td>${total ? Math.round((100 * (m[t.k] || 0)) / total) : 0}%</td></tr>`
                ).join('')}</tbody></table>
              </div></div>`;
          };
          return `<div class="mixhead"><h3>Commit mix</h3><div class="sub">What kind of work, from each commit's Conventional Commits type, over ${esc(periodLabel())} · Refactor includes perf and style · Docs &amp; chore is everything else (docs, chore, ci, build…)</div></div>
      <div class="mixgrid">${cards.map(card).join('')}</div>`;
        }

        // ---------- time and cost (2026-10-03) ----------
        // Cost is paid time, not commit days: an engineer costs every working day they
        // are on the team, committing or not. Git has no employment dates and there
        // are no FTE figures, so "on the team" is estimated as first commit → last
        // commit, in weekdays, clipped to the period the dials select. Managers
        // (author-map role) and bots are not in `authors`, so carry no cost here.
        //   paid engineer-years = Σ weekdays on the team ÷ 260
        //   cost to date        = paid engineer-years × annual package
        //   pace                = ncloc ÷ (paid engineer-years × working days a year)
        //   per target: effort (engineer working days) = target ÷ pace;
        //               cost = effort × annual ÷ working days;
        //               time · 1 engineer = effort, as calendar time at workDays a year;
        //               time · current team = target ÷ the latest complete period's
        //               ncloc, in that period's unit (the grouping on the dial).
        // Always in ncloc (the targets are code lines), whichever metric is shown.
        const COST = Object.assign({ annual: 150000, currency: 'AUD', workDays: 220 }, D.cost || {});
        const COST_TARGETS = [10e3, 50e3, 100e3, 150e3, 200e3, 250e3]; // 30k and 75k dropped (2026-10-03)
        const money = (v) =>
          new Intl.NumberFormat('en-AU', { style: 'currency', currency: COST.currency, maximumFractionDigits: 0 }).format(v);
        // weekdays from a to b inclusive (ISO dates)
        const weekdays = (a, b) => {
          let s = parse(a),
            e = parse(b),
            n = 0;
          if (e < s) return 0;
          const full = Math.floor((e - s) / (7 * 86400000));
          n = full * 5;
          for (let d = addDays(s, full * 7); d <= e; d = addDays(d, 1)) n += d.getUTCDay() % 6 ? 1 : 0;
          return n;
        };
        // engineer working days as calendar time, at COST.workDays a year
        const span = (wd) => {
          const yrs = wd / COST.workDays;
          return yrs < 0.25
            ? `${(yrs * 52).toFixed(1)} weeks`
            : yrs < 2
              ? `${(yrs * 12).toFixed(1)} months`
              : `${yrs.toFixed(1)} years`;
        };
        // each engineer's first and last commit over all history
        const tenure = (() => {
          const t = {};
          for (const d of D.days)
            for (const a of authors) {
              const o = d.by[a];
              if (!o || !o.commits) continue;
              (t[a] = t[a] || { first: d.date, last: d.date }).last = d.date;
            }
          return t;
        })();
        function costSection(s, days, bs) {
          const ws = days.length ? days[0].date : '',
            we = days.length ? days[days.length - 1].date : '';
          let paidDays = 0,
            people = 0;
          for (const a in tenure) {
            const f = tenure[a].first > ws ? tenure[a].first : ws,
              l = tenure[a].last < we ? tenure[a].last : we;
            const w = ws && f <= l ? weekdays(f, l) : 0;
            if (w) {
              paidDays += w;
              people++;
            }
          }
          const paidYears = paidDays / 260;
          const workDays = paidYears * COST.workDays;
          const pace = workDays ? s.ncloc / workDays : 0; // ncloc per paid engineer working day
          const daily = COST.annual / COST.workDays;
          const yearsSpan = ws ? weekdays(ws, we) / 260 : 0;
          // the team as it stands: the latest complete period at this grouping
          const done = bs.filter((b) => !b.partial && b.team.ncloc > 0);
          const cur = done[done.length - 1];
          const curEng = cur ? authors.filter((a) => cur.by[a] && cur.by[a].commits > 0).length : 0;
          const G = groupLabel();
          // ---- milestones: what actually happened (2026-10-03) ----
          // Walk the period day by day; a milestone is reached the first day the
          // running ncloc total crosses it. Each stretch runs from the day after the
          // previous milestone (or the period start) to that day, and carries who
          // was there: distinct committers, the average paid headcount (tenure
          // overlap ÷ weekdays), and the paid cost of the stretch.
          const nextIso = (iso) => isoOf(addDays(parse(iso), 1));
          const stretch = (a0, b0) => {
            let paid = 0;
            for (const a in tenure) {
              const f = tenure[a].first > a0 ? tenure[a].first : a0,
                l = tenure[a].last < b0 ? tenure[a].last : b0;
              if (f <= l) paid += weekdays(f, l);
            }
            const wk = weekdays(a0, b0);
            const who = new Set();
            for (const d of days)
              if (d.date >= a0 && d.date <= b0)
                for (const a of authors) if (d.by[a] && d.by[a].commits > 0) who.add(a);
            return { paid, avg: wk ? paid / wk : 0, committers: who.size, cost: (paid / 260) * COST.annual };
          };
          // calendar time, always in months: one unit per column so rows compare
          // straight down (2026-10-03)
          const took = (a0, b0) => {
            const n = (parse(b0) - parse(a0)) / 86400000 + 1;
            return `${(n / 30.44).toFixed(1)} months`;
          };
          // the stretch's paid engineer-time as one person's calendar: its paid
          // engineer weekdays, at 260 weekdays a year; always in years
          const alone = (paid) => `${(paid / 260).toFixed(1)} years`;
          // paid engineer weekdays from the start of the period: "1 engineer alone"
          // is cumulative, like From start and the cost (2026-10-03)
          let cumPaid = 0;
          let cum = 0,
            ti = 0,
            from = ws,
            cumCost = 0,
            prevAvg = null;
          const rows = [];
          for (const d of days) {
            cum += d.team.ncloc;
            while (ti < COST_TARGETS.length && cum >= COST_TARGETS[ti]) {
              const st = stretch(from, d.date);
              cumCost += st.cost;
              const trend =
                prevAvg === null
                  ? '—'
                  : st.avg > prevAvg * 1.1
                    ? '↑ growing'
                    : st.avg < prevAvg * 0.9
                      ? '↓ shrinking'
                      : '→ steady';
              rows.push(
                `<tr><td>${fmt(COST_TARGETS[ti])}</td><td>${Number(d.date.slice(8, 10))} ${MONTH[Number(d.date.slice(5, 7)) - 1]} ${d.date.slice(0, 4)}</td><td>${took(from, d.date)}</td><td>${took(ws, d.date)}</td><td>${alone((cumPaid += st.paid))}</td><td>${st.committers}</td><td>${st.avg.toFixed(1)}</td><td>${trend}</td><td>${money(cumCost)}</td></tr>`
              );
              prevAvg = st.avg;
              from = nextIso(d.date);
              ti++;
            }
          }
          // milestones not reached yet: an estimate at the latest complete period's pace
          for (; ti < COST_TARGETS.length; ti++) {
            const left = COST_TARGETS[ti] - cum;
            const est = cur ? left / cur.team.ncloc : 0;
            rows.push(
              `<tr class="dim"><td>${fmt(COST_TARGETS[ti])}</td><td>not yet</td><td colspan="7">${fmt(Math.round(left))} ncloc to go${cur ? ` · about ${est.toFixed(1)} ${G}${est === 1 ? '' : 's'} at ${esc(cur.title)} pace (${fmt(cur.team.ncloc)} ncloc from ${curEng} engineers)` : ''}</td></tr>`
            );
          }
          const body =
            pace <= 0
              ? '<p class="note">No net ncloc in this period, so no milestones to show.</p>'
              : `<p class="note" style="margin:0 0 10px">Over ${esc(periodLabel())}: <b>${fmt(s.ncloc)} ncloc</b> for an estimated <b>${money(paidYears * COST.annual)}</b> (${paidYears.toFixed(1)} paid engineer-years across ${people} engineers, about ${yearsSpan ? (paidYears / yearsSpan).toFixed(1) : '—'} on the team at a time) → <b>${fmt(Math.round(pace))} ncloc per paid engineer working day</b>, <b>${money((10000 / pace) * daily)} per 10,000 ncloc</b>.</p>
      <div class="scroll"><table class="pinned compact">
        <thead><tr><th>Milestone<br><span style="font-weight:400;color:var(--muted)">running ncloc</span></th><th>Reached</th><th>Took<br><span style="font-weight:400;color:var(--muted)">since previous</span></th><th>From start<br><span style="font-weight:400;color:var(--muted)">the team</span></th><th>From start<br><span style="font-weight:400;color:var(--muted)">1 engineer alone</span></th><th>People who<br>committed</th><th>Average<br>team size</th><th>Team</th><th>Cumulative cost<br><span style="font-weight:400;color:var(--muted)">${esc(COST.currency)}</span></th></tr></thead>
        <tbody>${rows.join('')}</tbody>
      </table></div>
      <p class="note" style="margin-top:8px"><b>What actually happened.</b> A milestone is reached the first day the running ncloc total since ${esc(periodLabel())} began crosses it. <b>Took</b> is calendar time since the previous milestone. <b>From start · 1 engineer alone</b> is how long one person would have needed to reach the milestone from the start: all the paid engineer-time up to then, as one person's calendar. <b>People who committed</b> counts everyone who made at least one commit in the stretch, however briefly. <b>Average team size</b> is how many engineers were on the team on a typical working day of the stretch (each counted from first to last commit); it drives the cost. When the two are close the team was stable; when more people committed than the average, people joined or passed through. <b>Team</b> compares the average team size with the previous stretch: ↑/↓ beyond ±10%. <b>Cost is paid time, not commit days:</b> ${money(COST.annual)} a year all-inclusive per engineer, ${COST.workDays} of those days worked, so a worked day costs ${money(daily)}. Managers and excluded occasional contributors are not costed (author map). Milestones not reached yet are estimated at the latest complete ${G}'s pace; switch <i>Group by</i> to change the yardstick. <b>Estimate:</b> git has no employment dates, so first-to-last commit misses onboarding and notice. Lines measure volume, not value.</p>`;
          return acc(
            'cost',
            'Time and cost',
            `When each ncloc milestone was reached, how long it took, who was on the team and what it cost · ${esc(periodLabel())} · ${money(COST.annual)} per engineer a year, ${COST.workDays} working days`,
            body
          );
        }

        // ---------- paint ----------
        // Four panels fold away; closed by default, and the choice sticks.
        const accOpen = (k) => store.get('acc.' + k, '0') === '1';
        const acc = (k, title, sub, body) => `
    <details class="card acc" data-acc="${k}"${accOpen(k) ? ' open' : ''}>
      <summary><span class="ah"><h2>${title}</h2><div class="sub">${sub}</div></span></summary>
      ${body}
    </details>`;

        const periodLabel = () =>
          periodAll
            ? 'all history'
            : `the last ${periodN} ${periodN === 1 ? periodUnit.replace(/s$/, '') : periodUnit}`;
        const groupLabel = () =>
          ({ days: 'day', weeks: 'week', months: 'month', quarters: 'quarter', years: 'year' })[
            group
          ];

        function paint() {
          const days = windowDays();
          const bs = aggregate(days);
          const s = summary(days);
          const t = D.tree,
            f = D.force;
          const whole = periodAll;
          // Over all history the headline is the working tree (it includes work not
          // yet committed); inside a window only committed history can answer.
          const lines = whole ? (isN() ? t.ncloc : t.total) : s.lines;
          const engDays = whole ? f.engDays : s.engDays;
          const mult = engDays ? Math.max(0, lines / (BASE * engDays)) : 0;
          const delta = whole ? (isN() ? t.ncloc - t.nclocHistory : t.total - t.history) : 0;

          app.innerHTML = `
    <div class="bar">
      <div class="ctl"><label for="pn">Period</label>
        <button type="button" id="pall" class="pill" aria-pressed="${periodAll}">All history</button>
        <span class="lastwrap">last
          <input type="number" id="pn" min="1" max="999" value="${periodN}" aria-label="how many">
          <select id="punit" aria-label="period unit">
            ${['days', 'weeks', 'months', 'years'].map((u) => `<option value="${u}"${u === periodUnit ? ' selected' : ''}>${u}</option>`).join('')}
          </select>
        </span>
      </div>
      <div class="ctl"><label for="pgroup">Group by</label>
        <select id="pgroup">
          ${['days', 'weeks', 'months', 'quarters', 'years'].map((g) => `<option value="${g}"${g === group ? ' selected' : ''}>${g}</option>`).join('')}
        </select>
      </div>
      <div class="seg" id="metric" role="group" aria-label="Line metric">
        <button type="button" data-metric="loc" aria-pressed="${!isN()}">Raw lines</button>
        <button type="button" data-metric="ncloc" aria-pressed="${isN()}">ncloc · code only</button>
      </div>
    </div>
    <header>
      <h1>Agentic Engineering Dashboard</h1>
      <span class="sub">${esc(D.repo)} @ <code>${esc(D.head)}</code></span>
      <span class="meta"><b class="stamp">Last updated ${esc(stamp(D.generatedAt))}</b><br />${esc(ago(D.generatedAt))} · cache ${esc(D.cache.state)}${D.cache.frozenThrough ? ', frozen through ' + esc(D.cache.frozenThrough) : ''}</span>
    </header>
    <p class="note">Showing <b>${esc(periodLabel())}</b>${whole ? '' : ` — ${bs.length ? esc(bs[0].dates[0]) + ' to ' + esc(lastDate) : 'no commits'}`}, grouped by ${esc(groupLabel())}, measured in ${isN() ? 'ncloc (code lines only)' : 'raw lines'}. Every figure on this page follows these three dials${whole ? '' : '; the tiles count what was committed inside the window'}.</p>
    <section class="tiles">
      <div class="tile"><div class="k">Force multiplier</div><div class="v hero">${fx(mult)}</div><div class="n">${fmt(lines)} ${UNIT()} ÷ (${BASE} × ${engDays} engineer-days)</div></div>
      <div class="tile"><div class="k">${isN() ? 'Code lines (ncloc)' : 'Functional LOC'}</div><div class="v">${fmt(lines)}</div><div class="n">${whole ? `${fmt(isN() ? t.nclocProduct : t.product)} product + ${fmt(isN() ? t.nclocTest : t.test)} test + ${fmt(isN() ? t.nclocPipeline : t.pipeline)} pipeline + ${fmt(isN() ? t.nclocInfra : t.infra)} infra` : `net, committed in ${esc(periodLabel())}`}</div></div>
      <div class="tile"><div class="k">Output in engineer-days</div><div class="v">${fmt(Math.round(lines / BASE))}</div><div class="n">at ${BASE} ${UNIT()} / engineer / day</div></div>
      <div class="tile"><div class="k">Engineers</div><div class="v">${whole ? f.engineers : s.engineers}</div><div class="n">human commit authors${whole ? '' : ' in this period'} · bots excluded</div></div>
      <div class="tile"><div class="k">Coding days</div><div class="v">${whole ? f.codingDays : s.codingDays}</div><div class="n">${engDays} engineer-days${engDays > (whole ? f.codingDays : s.codingDays) ? ' · two people on one date count twice' : ''}</div></div>
    </section>
    ${t.clean === false ? `<p class="note warn">The checkout has local changes. The headline counts them; history on the default branch does not. Commit or set them aside before quoting these figures.</p>` : ''}
    ${Math.abs(delta) > 0.001 * Math.abs(isN() ? t.ncloc : t.total) ? `<p class="note warn">Not reconciled: history on main sums to ${fmt(isN() ? t.nclocHistory : t.history)} ${UNIT()}, but the code today holds ${fmt(isN() ? t.ncloc : t.total)} (Δ ${delta > 0 ? '+' : ''}${fmt(delta)}). The chart and the headline disagree by that much. Cause not traced; do not quote these figures until it is.</p>` : ''}
    <section class="card">
      <div class="card-head"><div><h2 id="c1title"></h2><div class="sub" id="c1sub"></div></div>
        <div class="seg" id="c1view" role="group" aria-label="What to plot">
          <button type="button" data-view="lines">${isN() ? 'ncloc' : 'Lines'}</button>
          <button type="button" data-view="mult">Multiplier</button>
          <button type="button" data-view="cumulative">Cumulative</button>
        </div>
        <div class="legend">${TEAM_ONLY ? '<span><i style="background:var(--team)"></i>Team</span>' : authors.map((a) => `<span><i style="background:${colorOf[a]}"></i>${esc(a)}</span>`).join('')}<span id="c1pace"><i class="line" style="background:var(--muted)"></i>Baseline pace</span><span id="c1run"><i class="line avg"></i>Running average</span><span id="c1todate" hidden><i class="todate"></i>To date (period still running)</span><span id="c1off"><i style="background:${TEAM_ONLY ? 'var(--team)' : colorOf[authors[0]]};opacity:0.42;box-shadow:inset 0 0 0 1px ${TEAM_ONLY ? 'var(--team)' : colorOf[authors[0]]}"></i>Non-business day</span></div></div>
      <div class="chart" id="c1"><div class="tip"></div></div>
    </section>
    ${
      TEAM_ONLY
        ? ''
        : acc(
            'author',
            'By author',
            `Net ${isN() ? 'ncloc' : 'functional LOC'} over ${esc(periodLabel())} · identity keyed by email`,
            `
      <div class="scroll"><table>
        <thead><tr><th>Author</th><th>Commits</th><th>${isN() ? 'ncloc' : 'Functional LOC'}</th><th>Days</th><th>Multiplier</th><th>Since</th><th>Share</th></tr></thead>
        <tbody>${
          authors
            .filter((a) => s.by[a])
            .map((a) => {
              const o = s.by[a],
                since = (D.authors.find((x) => x.name === a) || {}).since || o.since;
              return `<tr><td><i style="display:inline-block;width:9px;height:9px;border-radius:2px;background:${colorOf[a]};margin-right:8px"></i>${esc(a)}</td><td>${fmt(o.commits)}</td><td>${fmt(LV(o))}</td><td>${o.days}</td><td>${fx(MU(o))}</td><td>${esc(since)}</td><td>${((100 * Math.max(LV(o), 0)) / Math.max(s.lines, 1)).toFixed(1)}%</td></tr>`;
            })
            .join('') || '<tr><td colspan="7" class="dim">no commits in this period</td></tr>'
        }</tbody>
        <tfoot><tr><td>Team</td><td>${fmt(s.commits)}</td><td>${fmt(s.lines)}</td><td>${s.engDays}</td><td>${fx(s.teamMult)}</td><td colspan="2" style="text-align:left;font-weight:400;color:var(--muted)">days = engineer-days · multiplier = team lines ÷ (${BASE} × engineer-days)</td></tr></tfoot>
      </table></div>
      ${mixSection(s)}`
          )
    }
    ${acc(
      'period',
      `By ${esc(groupLabel())}`,
      `Newest first · the team's multiplier, commits, engineers and ${UNIT()}, with per-engineer rates · “·” = no commit`,
      `
      <div class="scroll" id="daytable"></div>`
    )}
    ${costSection(s, days, bs)}
    <div class="two">
      ${acc(
        'language',
        'By language',
        'Current tree · detected from the files · not filtered by period',
        `
        <div class="scroll"><table>
          <thead><tr><th>Language</th><th>Files</th><th>${isN() ? 'ncloc' : 'Functional LOC'}</th><th>Share</th></tr></thead>
          <tbody>${(D.languages || []).map((l) => `<tr><td>${esc(l.name)}</td><td>${fmt(l.files)}</td><td>${fmt(LV(l))}</td><td>${((100 * LV(l)) / Math.max(isN() ? t.ncloc : t.total, 1)).toFixed(1)}%</td></tr>`).join('')}</tbody>
          <tfoot><tr><td>Total</td><td>${fmt((D.languages || []).reduce((x, l) => x + l.files, 0))}</td><td>${fmt(isN() ? t.ncloc : t.total)}</td><td>100%</td></tr></tfoot>
        </table></div>`
      )}
      ${acc(
        'workspace',
        'By workspace',
        'Current tree · folders with a package manifest · a file counts in its deepest package',
        `
        <div class="scroll"><table>
          <thead><tr><th>Workspace</th><th>${isN() ? 'ncloc' : 'Functional LOC'}</th><th>Share</th></tr></thead>
          <tbody>${D.workspaces.map((w) => `<tr><td>${esc(w.name)}</td><td>${fmt(LV(w))}</td><td>${((100 * LV(w)) / Math.max(isN() ? t.ncloc : t.total, 1)).toFixed(1)}%</td></tr>`).join('')}
            <tr><td class="dim">(everything not under a listed package)</td><td class="dim">${fmt((isN() ? t.ncloc : t.total) - D.workspaces.reduce((x, w) => x + LV(w), 0))}</td><td class="dim">${((100 * ((isN() ? t.ncloc : t.total) - D.workspaces.reduce((x, w) => x + LV(w), 0))) / Math.max(isN() ? t.ncloc : t.total, 1)).toFixed(1)}%</td></tr></tbody>
          <tfoot><tr><td>Total</td><td>${fmt(isN() ? t.ncloc : t.total)}</td><td>100%</td></tr></tfoot>
        </table></div>
        <p class="note" style="margin-top:8px">UI assets (css/html and drawings under assets/): ${fmt(t.ui)} lines, reported but not counted.</p>`
      )}
    </div>
    ${acc(
        'scope',
        'Scope',
        'What these numbers count',
        `
        <dl class="scope">
          <dt>Metric</dt><dd>${
            isN()
              ? '<b>ncloc</b> — a physical line counts only if it holds a character that is neither whitespace nor part of a comment. A trailing comment or a lone <code>}</code> still counts; blank and comment-only lines do not. Sonar&rsquo;s rule. <code>//</code> and <code>/* */</code> open a comment in the C family (C, C++, Objective-C, Swift, Go, Rust, Java, Kotlin, C#, JS/TS, shaders); <code>//</code> in Zig; <code>#</code> in Python, Ruby, YAML, shell, Dockerfiles, Make and CMake; both in Terraform, Nix and PHP; <code>--</code> in Lua and Haskell. Python docstrings count as code.'
              : '<b>Raw lines</b> — every physical line in a counted file, blanks and comments included.'
          }</dd>
          <dt>Languages</dt><dd>Detected from the files, not configured: every programming language the counter knows that this repository holds (the By language table).</dd>
          <dt>Counted</dt><dd>What lands on the default branch (first-parent history, so a change merged by two routes counts once), aggregated as product + test + pipeline + infrastructure. Pipeline and infrastructure count for the same reason tests do: without them the product is fragile and cannot move at speed with confidence.</dd>
          <dt>Product</dt><dd>Executable code. A <code>scripts/</code> directory inside a package is that package&rsquo;s code and counts.</dd>
          <dt>Test</dt><dd>Code at a test path: <code>tests/</code> <code>test/</code> <code>spec/</code> <code>__tests__/</code> <code>*Tests/</code> <code>*-tests/</code> <code>e2e/</code> <code>fixtures/</code>; <code>.test.</code> <code>.spec.</code>; <code>_test.</code> <code>_spec.</code>; <code>test_*.py</code>; <code>*Test.java</code> <code>*Tests.swift</code>; Maestro flows (YAML under <code>integration-tests/</code>). Tests inline in a source file (Zig, Rust) count as product.</dd>
          <dt>Pipeline</dt><dd>CI/CD: <code>.github/</code>, <code>.gitlab-ci.yml</code>, <code>.circleci/</code>, <code>Jenkinsfile</code>, <code>.buildkite/</code>, Azure Pipelines, <code>fastlane/</code> and the like.</dd>
          <dt>Infrastructure</dt><dd>Terraform and HCL, Dockerfiles, compose files, k8s and Helm, <code>infra/</code> <code>deploy/</code> <code>terraform/</code> <code>cdk/</code> <code>pulumi/</code> trees, <code>render.yaml</code>, and root <code>scripts/</code> (release, CI and E2E tooling, shell included).</dd>
          <dt>Not product code</dt><dd>Build and tool configuration (<code>*.config.*</code>, <code>.*rc.js</code>, <code>*.gradle</code>, Makefile, CMake, <code>build.zig</code>, <code>Package.swift</code>, Nix, Bazel, <code>setup.py</code>, <code>build.rs</code>, Gemfile, Podfile) and test setup (<code>*.setup.*</code>, <code>setupTests.*</code>, <code>conftest.py</code>).</dd>
          <dt>Not the team&rsquo;s code</dt><dd>Vendored and generated code (<code>vendor/</code> <code>third_party/</code> <code>node_modules/</code> <code>Pods/</code> <code>.yarn/</code>, <code>*.min.js</code> <code>*.pb.go</code> <code>generated/</code>, and whatever <code>.gitattributes</code> marks <code>linguist-vendored</code>, <code>-generated</code> or <code>-documentation</code>); lockfiles; <code>docs/</code> <code>examples/</code> <code>samples/</code> <code>poc/</code>; AI-agent tooling (<code>.agents/</code>, <code>prompts/</code>).</dd>
          <dt>Checked against</dt><dd>the ncloc rule mirrors SonarQube&rsquo;s; on a large TypeScript repo the two agreed within 0.15%.</dd>
          <dt>Reported, not counted</dt><dd><code>.css</code> <code>.scss</code> <code>.html</code> and code under <code>assets/</code> (drawings such as SVG wrapped as TSX)</dd>
          <dt>Excluded</dt><dd>Data and prose formats (<code>.json</code> <code>.toml</code> <code>.xml</code> <code>.md</code> <code>.txt</code> <code>.snap</code>), shell outside root <code>scripts/</code>, other YAML, and anything gitignored</dd>
          <dt>Authors</dt><dd>resolved by the author map (<code>.claude/force-multiplier/author-map.tsv</code> in the repository, or <code>.git/loc/author-map.tsv</code>): each git identity mapped to a person and a role. Managers and excluded occasional contributors keep their lines in the team total but are out of headcount, engineer-days and cost; bots are dropped entirely</dd>
          <dt>Engineer-days</dt><dd>${esc(f.how)}${whole ? '' : ', counted inside the selected period'}</dd>
          <dt>Team multiplier</dt><dd>team lines ÷ (${BASE} × engineer-days), the same formula as the headline, in every view</dd>
          <dt>Floors</dt><dd>a net-deletion period shows its negative lines but a 0.0x multiplier</dd>
        </dl>`
      )}`;

          // --- wire the dials ---
          const pall = document.getElementById('pall');
          pall.onclick = () => {
            periodAll = !periodAll;
            store.set('periodAll', periodAll ? '1' : '0');
            paint();
          };
          const pn = document.getElementById('pn');
          const commitN = () => {
            const v = Math.max(1, Math.min(999, Number(pn.value) || 1));
            periodN = v;
            periodAll = false;
            store.set('periodN', v);
            store.set('periodAll', '0');
            paint();
          };
          pn.onchange = commitN;
          pn.onkeydown = (e) => {
            if (e.key === 'Enter') commitN();
          };
          document.getElementById('punit').onchange = (e) => {
            periodUnit = e.target.value;
            periodAll = false;
            store.set('periodUnit', periodUnit);
            store.set('periodAll', '0');
            paint();
          };
          document.getElementById('pgroup').onchange = (e) => {
            group = e.target.value;
            store.set('group', group);
            paint();
          };
          [...document.querySelectorAll('#metric button')].forEach((b) => {
            b.onclick = () => {
              metric = b.dataset.metric;
              store.set('metric', metric);
              paint();
            };
          });
          [...document.querySelectorAll('#c1view button')].forEach((b) => {
            b.setAttribute('aria-pressed', String(b.dataset.view === view));
            b.onclick = () => {
              view = b.dataset.view;
              store.set('view', view);
              paint();
            };
          });
          document.querySelector('.lastwrap').classList.toggle('off', periodAll);
          [...document.querySelectorAll('details.acc')].forEach((d) => {
            d.addEventListener('toggle', () =>
              store.set('acc.' + d.dataset.acc, d.open ? '1' : '0')
            );
          });

          const G = groupLabel(),
            U = UNIT();
          document.getElementById('c1title').textContent =
            view === 'mult'
              ? `Multiplier per ${G}`
              : view === 'cumulative'
                ? `Cumulative ${U}`
                : `Net ${isN() ? 'ncloc' : 'functional LOC'} per ${G}`;
          document.getElementById('c1sub').textContent = TEAM_ONLY
            ? view === 'mult'
              ? `The team multiplier for each ${G} · dashed = the running average, which ends on the headline figure`
              : view === 'cumulative'
                ? `Running total from the first commit`
                : `The team's net total per ${G} · a bar below the baseline is a net-deletion ${G} · dashed = the running average per coding ${G}`
            : view === 'mult'
              ? `The team multiplier for each ${G}, split by each author's share of the lines merged to main · dashed = the running average`
              : view === 'cumulative'
                ? `Running total from the first commit, stacked by author`
                : `Stacked by author · a bar below the baseline is a net-deletion ${G} · dashed = the running average per coding ${G}`;
          document.getElementById('c1sub').textContent +=
            ` · drawn from ${Number(chartFrom().slice(8, 10))} ${MONTH[Number(chartFrom().slice(5, 7)) - 1]} ${chartFrom().slice(0, 4)}`;
          document.getElementById('c1pace').hidden = true; // the pace line is not drawn
          document.getElementById('c1run').hidden = view === 'cumulative';
          document.getElementById('c1off').hidden = view === 'cumulative' || group !== 'days';
          if (!bs.length) {
            document.getElementById('c1').innerHTML =
              '<div class="empty">No commits in this period.</div>';
            document.getElementById('daytable').innerHTML = '';
            return;
          }
          document.getElementById('c1todate').hidden =
            view === 'cumulative' || !bs[bs.length - 1].partial;
          drawTable(document.getElementById('daytable'), bs);
          const c1 = document.getElementById('c1');
          const fromIso = chartFrom(),
            from = parse(fromIso);
          const drawn = aggregate(days.filter((d) => d.date >= fromIso));
          if (!drawn.length) {
            c1.innerHTML = `<div class="empty">No commits since ${auDay(fromIso)}/${fromIso.slice(0, 4)}.</div>`;
            return;
          }
          const hidden = days.filter((d) => d.date < fromIso);
          const seed = {
            lines: hidden.reduce((s, d) => s + LV(d.team), 0),
            days: hidden.reduce((s, d) => s + d.humans, 0),
          };
          if (view === 'cumulative') drawCumulative(c1, drawn, from);
          else if (view === 'mult') drawMult(c1, drawn, from, seed);
          // Every drawn bucket is also a period bucket, so the rest are the undrawn ones.
          else
            drawBars(c1, drawn, from, {
              lines: seed.lines,
              buckets: bs.length - drawn.length,
              days: seed.days,
            });
        }

        paint();
      })();
    </script>
  </body>
</html>
